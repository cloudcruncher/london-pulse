name: Daily update

on:
  schedule:
    - cron: "30 6 * * *"   # 06:30 UTC every day
  workflow_dispatch:

permissions: {}   # least privilege: each job declares what it needs

concurrency:
  group: london-pulse
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    environment: github-pages   # gives this job access to the MAPBOX_API_KEY environment secret
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Download previous snapshot
        run: |
          mkdir -p work
          today=$(date -u +%F)
          # newest snapshot asset from an earlier day (so same-day reruns still diff against yesterday)
          prev=$(gh release view snapshots --json assets -q '.assets[].name' 2>/dev/null \
                 | grep -E '^fsa-[0-9-]{10}\.parquet$' | sort | awk -v t="fsa-$today.parquet" '$0 < t' | tail -1 || true)
          if [ -n "$prev" ]; then
            gh release download snapshots -p "$prev" -D work --clobber
            mv "work/$prev" work/prev.parquet
            echo "previous snapshot: $prev"
          else
            echo "no previous snapshot (baseline run)"
          fi

      - name: Run pipeline
        run: |
          args=""
          [ -f work/prev.parquet ] && args="--prev work/prev.parquet"
          PYTHONPATH=src uv run --locked python -m london_pulse.run $args

      - name: Store today's snapshot
        run: |
          today=$(date -u +%F)
          gh release view snapshots >/dev/null 2>&1 || \
            gh release create snapshots --title "Daily snapshots" --notes "Daily FSA snapshots used to compute day-over-day changes. Last 14 days kept."
          cp work/latest.parquet "work/fsa-$today.parquet"
          gh release upload snapshots "work/fsa-$today.parquet" --clobber
          # keep the newest 14
          gh release view snapshots --json assets -q '.assets[].name' | grep -E '^fsa-' | sort | head -n -14 | \
            while read -r old; do gh release delete-asset snapshots "$old" -y; done

      - name: Commit data
        run: |
          git config user.name "london-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data site/api
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git push

      - name: Inject Mapbox token (public, URL-restricted; never committed)
        env:
          MAPBOX_API_KEY: ${{ secrets.MAPBOX_API_KEY }}
        run: |
          if [ -n "$MAPBOX_API_KEY" ]; then
            # only a public pk. token may ever be published; refuse anything else (e.g. a secret sk. token)
            [[ "$MAPBOX_API_KEY" =~ ^pk\.[A-Za-z0-9._-]+$ ]] || { echo "::error::MAPBOX_API_KEY is not a public pk. token"; exit 1; }
            printf 'window.LP_CONFIG = { mapboxToken: "%s" };\n' "$MAPBOX_API_KEY" > site/config.js
          fi

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

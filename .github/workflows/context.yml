name: Monthly area context (crime, stations and areas)

on:
  schedule:
    - cron: "0 9 5 * *"   # 5th of each month; police data for the previous month is published by then
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: london-pulse-context
  cancel-in-progress: false

jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Latest FSA snapshot (defines which grid cells to query)
        run: |
          mkdir -p work
          latest=$(gh release view snapshots --json assets -q '.assets[].name' | grep -E '^fsa-' | sort | tail -1)
          gh release download snapshots -p "$latest" -D work --clobber
          mv "work/$latest" work/latest.parquet

      - name: Cache census, deprivation and income reference data
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: work/reference
          key: areas-reference-${{ hashFiles('src/london_pulse/neighbourhoods.py') }}

      - name: Cache flood, air, noise and green-space source data
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            work/reference/flood_zones_rivers_sea.geojson
            work/reference/rofsw_*.zlib
            work/reference/laei2022_cells.parquet
            work/reference/noise_*_lden_r4.tif
            work/reference/os_greenspace.parquet
          key: environment-reference-${{ hashFiles('src/london_pulse/flood.py', 'src/london_pulse/air.py', 'src/london_pulse/noise.py', 'src/london_pulse/green.py') }}

      - name: Build stations.json and crime.json
        run: |
          PYTHONPATH=src uv run --locked python -m london_pulse.transport
          PYTHONPATH=src uv run --locked python -m london_pulse.crime

      - name: Build areas.json (tenure, deprivation, income and crime per LSOA)
        run: PYTHONPATH=src uv run --locked python -m london_pulse.neighbourhoods

      - name: Build prices.json (Land Registry sales and ONS private rents)
        continue-on-error: true
        run: PYTHONPATH=src uv run --locked python -m london_pulse.prices


      - name: Build environment.json (flood risk, air quality, noise and green space per LSOA)
        timeout-minutes: 30
        continue-on-error: true
        run: |
          PYTHONPATH=src uv run --locked python -m london_pulse.environment

      - name: Keep last month's environment.json if any topic failed
        # a partial file would drop a topic from the page, and a failed build must not block the other data
        run: |
          if ! python3 -c "import json,sys; d=json.load(open('site/api/v1/environment.json')); sys.exit(1 if d['skipped'] or len(d['topics'])<4 else 0)"; then
            echo "::warning::environment build incomplete; keeping the committed environment.json"
            git checkout -- site/api/v1/environment.json
          fi

      - name: Contract tests (areas and the rest of the API)
        run: MONTHLY_CONTRACT=1 API_DIR=site/api/v1 PYTHONPATH=src uv run --locked pytest tests/test_contract.py tests/test_neighbourhoods.py tests/test_prices.py tests/test_environment.py tests/test_flood.py tests/test_air.py tests/test_noise.py tests/test_green.py -q

      - name: Drop the large Price Paid files so they are not saved into the cache
        if: always()
        run: rm -f work/reference/pp-*.csv work/reference/*.zip work/reference/*.part

      - name: Commit and republish
        run: |
          git config user.name "london-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/api/v1/stations.json site/api/v1/crime.json site/api/v1/areas.json site/api/v1/prices.json site/api/v1/environment.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "data: stations, crime and areas $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase -X theirs -q && git push && break
            [ "$i" = 3 ] && { echo "::error::could not push"; exit 1; }
            sleep $((i * 5))
          done
          gh workflow run daily.yml

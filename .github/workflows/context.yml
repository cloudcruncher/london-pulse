name: Monthly area context (crime, stations and areas)

on:
  schedule:
    - cron: "0 9 5 * *"   # 5th of each month; police data for the previous month is published by then
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: london-pulse-context
  cancel-in-progress: false

jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Latest FSA snapshot (defines which grid cells to query)
        run: |
          mkdir -p work
          latest=$(gh release view snapshots --json assets -q '.assets[].name' | grep -E '^fsa-' | sort | tail -1)
          gh release download snapshots -p "$latest" -D work --clobber
          mv "work/$latest" work/latest.parquet

      - name: Cache census, deprivation and income reference data
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: work/reference
          key: areas-reference-${{ hashFiles('src/london_pulse/neighbourhoods.py') }}

      - name: Build stations.json and crime.json
        run: |
          PYTHONPATH=src uv run --locked python -m london_pulse.transport
          PYTHONPATH=src uv run --locked python -m london_pulse.crime

      - name: Build areas.json (tenure, deprivation, income and crime per LSOA)
        run: PYTHONPATH=src uv run --locked python -m london_pulse.neighbourhoods

      - name: Build prices.json (Land Registry sales and ONS private rents)
        continue-on-error: true
        run: PYTHONPATH=src uv run --locked python -m london_pulse.prices


      - name: Contract tests (areas and the rest of the API)
        run: MONTHLY_CONTRACT=1 API_DIR=site/api/v1 PYTHONPATH=src uv run --locked pytest tests/test_contract.py tests/test_neighbourhoods.py tests/test_prices.py -q

      - name: Drop the large Price Paid files so they are not saved into the cache
        if: always()
        run: rm -f work/reference/pp-*.csv

      - name: Commit and republish
        run: |
          git config user.name "london-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/api/v1/stations.json site/api/v1/crime.json site/api/v1/areas.json site/api/v1/prices.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "data: stations, crime and areas $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase -X theirs -q && git push && break
            [ "$i" = 3 ] && { echo "::error::could not push"; exit 1; }
            sleep $((i * 5))
          done
          gh workflow run daily.yml
